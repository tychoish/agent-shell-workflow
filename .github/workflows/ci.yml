name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs_version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - "29.4"
          - "30.2"

    steps:
      - uses: actions/checkout@v5

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@main
        with:
          dependencies: "agent-shell transient annotated-completing-read"
          target-files: "agent-shell-workflow.el agent-shell-workflow-menu.el agent-shell-workflow-library.el agent-shell-workflow-github.el agent-shell-workflow-pipeline.el"

      - name: Run ERT Tests
        uses: tychoish/elisp-ci@main
        with:
          dependencies: "agent-shell transient annotated-completing-read"

      - name: Measure Code Coverage
        uses: tychoish/elisp-ci/coverage@main
        with:
          dependencies: "agent-shell transient annotated-completing-read"
          target-files: "agent-shell-workflow.el agent-shell-workflow-menu.el agent-shell-workflow-library.el agent-shell-workflow-github.el agent-shell-workflow-pipeline.el"
          report-format: "lcov"
          output-file: "coverage/lcov.info"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
